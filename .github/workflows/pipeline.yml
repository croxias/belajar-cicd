name: Simulasi CI/CD Pertamaku

# 1. TRIGGER (Kapan robot harus berjalan?)
on:
  push:
    branches:
      - main 

jobs:
  # 2. PROSES CI (Tahap Testing)
  testing-kode:
    runs-on: ubuntu-latest # Robot menggunakan komputer virtual Linux
    steps:
      - name: Tarik kode dari brankas
        uses: actions/checkout@v4
      
      - name: Jalankan Unit Test (Simulasi)
        run: |
          echo "Memulai pengecekan kode..."
          echo "Tidak ada error. Kode aman 100%!"

  # 3. PROSES CD (Tahap Staging)
  deploy-ke-staging:
    needs: testing-kode # Ini adalah rem otomatis: Jangan deploy kalau testing gagal!
    runs-on: ubuntu-latest
    steps:
      - name: Persiapan Deploy
        run: echo "Menyiapkan server Staging..."
      
      - name: Unggah Aplikasi
        run: echo "Aplikasi berhasil di-deploy ke lingkungan Staging!"

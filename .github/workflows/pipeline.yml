name: Simulasi CI/CD Pertamaku

on:
  push:
    branches:
      - main 

jobs:
  # 1. Tahap Testing
  testing-kode:
    runs-on: ubuntu-latest
    steps:
      - name: Tarik kode dari brankas
        uses: actions/checkout@v4
      - name: Jalankan Unit Test (Simulasi)
        run: echo "Tidak ada error. Kode aman 100%!"

  # 2. Tahap Staging (Otomatis)
  deploy-ke-staging:
    needs: testing-kode
    runs-on: ubuntu-latest
    steps:
      - name: Unggah Aplikasi
        run: echo "Aplikasi berhasil di-deploy ke lingkungan Staging!"

  # 3. Tahap Production (Butuh Persetujuan)
  deploy-ke-production:
    needs: deploy-ke-staging # Baru bisa jalan kalau staging sukses
    environment: Production # Ini yang memicu "rem" yang kita buat di Settings tadi
    runs-on: ubuntu-latest
    steps:
      - name: Deploy ke Publik
        run: echo "Aplikasi RESMI meluncur ke pengguna publik!"
